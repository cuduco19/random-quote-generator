<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content="This page loads a random quote from a public API and lets the user get new quotes. It will also fall back to a local array if the API is unavailable">
        <title>Random Quote Generator</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
        <link rel="stylesheet" href="styles.css">
        <script type="module" src="app.js"></script>
    </head>
    <body>
        <div class="card" id="quote-card">
            <div class="quote" id="quote-text">Loading quote...</div>
            <div class="author" id="quote-author"></div>
            <div class="controls">
                <button class="secondary" id="copy-btn">Copy</button>
                <button class="primary" id="new-quote">New Quote</button>
            </div>
        </div>
    </body>
</html>
